name: auto-publish
on:
  pull_request: {}
  push:
    branches: [main]
jobs:
  main:
    name: Build, Validate and Deploy
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - source: index.bs
            destination: index.html
          - source: goods-services.bs
            destination: goods-services.html
          - source: gsp.bs
            destination: gsp.html
    steps:
      - uses: actions/checkout@v4
      - uses: w3c/spec-prod@v2
        with:
          GH_PAGES_BRANCH: gh-pages
          TOOLCHAIN: bikeshed
          SOURCE: ${{ matrix.source }}
          DESTINATION: ${{ matrix.destination }}
